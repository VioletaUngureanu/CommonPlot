spring.application.name=backend

# ?? PostgreSQL connection ?????????????????????????????????????
# Containerul Docker: commonplot-db pe portul 5433
spring.datasource.url=jdbc:postgresql://localhost:5433/commonplot
spring.datasource.username=commonplot
spring.datasource.password=commonplot123


spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migrations
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql

logging.level.org.springframework.web=DEBUG
logging.level.org.commonplot=DEBUG
logging.level.org.flywaydb=INFO