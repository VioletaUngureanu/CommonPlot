server.port=8080

# ?? PostgreSQL connection ?????????????????????????????????????
spring.datasource.url=jdbc:postgresql://localhost:5433/commonplot
spring.datasource.username=commonplot
spring.datasource.password=commonplot123
spring.datasource.driver-class-name=org.postgresql.Driver

# ?? JPA / Hibernate ???????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ?? Flyway ????????????????????????????????????????????????????
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migrations

# ?? MongoDB (chat) ????????????????????????????????????????????
spring.data.mongodb.uri=mongodb://localhost:27017/commonplot_chat

# ?? JWT ???????????????????????????????????????????????????????
# Secretul JWT ? minim 32 caractere pentru HS256
jwt.secret=commonplot-secret-key-for-jwt-signing-2026
# Expiry: 15 minute în milisecunde
jwt.expiration=900000
# Refresh token: 7 zile
jwt.refresh-expiration=604800000

# ?? GraphQL ???????????????????????????????????????????????????
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql

# ?? Logging ???????????????????????????????????????????????????
logging.level.org.springframework.web=DEBUG
logging.level.org.commonplot=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.springframework.security=DEBUG