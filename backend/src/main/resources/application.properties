spring.application.name=backend

# ?? PostgreSQL connection ?????????????????????????????????????
# Containerul Docker: commonplot-db pe portul 5433
spring.datasource.url=jdbc:postgresql://localhost:5433/commonplot
spring.datasource.username=commonplot
spring.datasource.password=commonplot123
spring.datasource.driver-class-name=org.postgresql.Driver

# ?? JPA / Hibernate ???????????????????????????????????????????
# validate = Hibernate verific? c? schema din DB corespunde entit??ilor
# Flyway se ocup? de creare, Hibernate doar valideaz?
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ?? Flyway ????????????????????????????????????????????????????
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migrations

# ?? MongoDB (chat) ????????????????????????????????????????????
# Containerul Docker: commonplot-mongo pe portul 27017
spring.data.mongodb.uri=mongodb://localhost:27017/commonplot_chat

# ?? GraphQL ???????????????????????????????????????????????????
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql

# ?? Logging ???????????????????????????????????????????????????
logging.level.org.springframework.web=DEBUG
logging.level.org.commonplot=DEBUG
logging.level.org.flywaydb=INFO